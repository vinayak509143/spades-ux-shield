name: Quarantine pending-review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lists/pending-review.txt'
      - 'scripts/quarantine/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate-pending
