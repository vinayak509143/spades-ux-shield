<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dawn-like clean store</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .header {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
      }
      .hero__title {
        margin: 24px 16px 8px;
      }
      .price {
        margin: 0 16px 16px;
        font-size: 1.25rem;
      }
      .product-form__submit,
      .checkout-cta {
        display: inline-block;
        margin: 8px 16px;
        padding: 8px 16px;
        background: #111;
        color: #fff;
      }
      .cart-drawer {
        margin: 24px 16px;
        padding: 12px;
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <header class="header">Clean Outfitters</header>
    <h1 class="hero__title">Summer collection</h1>
    <p class="price">$34.50</p>
    <button class="product-form__submit" type="button">Add to cart</button>
    <aside class="cart-drawer">
      <p>1 item</p>
      <button class="checkout-cta" type="button">Check out</button>
    </aside>
  </body>
</html>
